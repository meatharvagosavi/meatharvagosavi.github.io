const SURF={

  {n:'SGD',c:C.mute,step:(x,y,g,h,t,s,m)=>[x-.46*m*g,y-.46*m*h]},

];

const runOpt=(o,S,m,N)=>{let[x,y]=S.start;const st={},pts=[[x,y]];for(let t=1;t<N;t++){const[g,h]=S.g(x,y);[x,y]=o.step(x,y,g,h,t,st,m);if(!isFinite(x)||!isFinite(y)||Math.abs(x)>40||Math.abs(y)>40)break;pts.push([x,y])}return pts};

function Race(fig,svg,st,onDone){

  const bg=(W,H,S,mx,my)=>{const k=W+'x'+H+st.surf;if(cache.k===k)return cache.g;const cw=Math.max(5,Math.round(W/170)),ch=cw;let g='';const lo=Math.log(.02),hi=Math.log(S.f(XR,YR)+.02);
    for(let px=0;px<W;px+=cw)for(let py=0;py<H;py+=ch){const x=(px+cw/2-W/2)/(W/2-20)*XR,y=-(py+ch/2-H/2)/(H/2-18)*YR;const lv=Math.max(0,Math.min(11,Math.floor((Math.log(S.f(x,y)+.02)-lo)/(hi-lo)*12)));const a=(lv%2?.03:.07)+(11-lv)*.006;g+=`<rect x="${px}" y="${py}" width="${cw+.5}" height="${ch+.5}" fill="rgba(138,180,255,${a.toFixed(3)})"/>`}
    cache={k,g};return g};
  const draw=()=>{const W=fig.clientWidth,H=fig.clientHeight;if(!W||!H)return;const S=SURF[st.surf];
    const mx=x=>W/2+x/XR*(W/2-20),my=y=>H/2-y/YR*(H/2-18);
    let g=bg(W,H,S,mx,my);const lab='font-family="JetBrains Mono, monospace" font-size="13" style="paint-order:stroke;stroke:#0c0d10;stroke-width:4px"';
    g+=`<circle cx="${W/2}" cy="${H/2}" r="6" fill="${C.lime}"/><text x="${W/2+12}" y="${H/2+28}" fill="${C.lime}" ${lab}>minimum</text>`;
    g+=`<circle cx="${mx(S.start[0])}" cy="${my(S.start[1])}" r="6" fill="none" stroke="${C.ink}" stroke-width="2"/><text x="${mx(S.start[0])+12}" y="${my(S.start[1])+4}" fill="${C.ink}" ${lab}>start</text>`;
    P.forEach(o=>{const pts=o.p.slice(0,T);const d=pts.map((p,i)=>(i?'L':'M')+mx(p[0]).toFixed(1)+' '+my(p[1]).toFixed(1)).join(' ');const e=pts[pts.length-1];
      g+=`<path d="${d}" fill="none" stroke="${o.c}" stroke-width="${o.n==='Adam'?2.8:2}" stroke-linejoin="round"/><circle cx="${mx(e[0]).toFixed(1)}" cy="${my(e[1]).toFixed(1)}" r="5" fill="${o.c}"/>`});
    g+=`<text x="${W-16}" y="${H-16}" text-anchor="end" fill="${C.mute}" ${lab}>step ${Math.min(T,st.N)} / ${st.N}${W>560?'   '+S.eq:''}</text>`;
    svg.innerHTML=g};
  const go=()=>{build();clearInterval(timer);if(still){T=st.N;draw();onDone&&onDone(P);return}T=1;timer=setInterval(()=>{T++;draw();if(T>=st.N){clearInterval(timer);onDone&&onDone(P)}},45)};
  const ro=new ResizeObserver(draw);ro.observe(fig);
  CLEAN.push(()=>{clearInterval(timer);ro.disconnect()});
  return {go};
}

const DEMOS={
opt:{h:()=>`<div class="demo"><div class="demo-bar">
  <label for="surf">Loss surface<select id="surf">${Object.entries(SURF).map(([k,s])=>`<option value="${k}">${s.n}</option>`).join('')}</select></label>
  <label for="lr">Learning-rate scale: <b id="lrv">1.00×</b><input id="lr" type="range" min="0.25" max="1.6" step="0.05" value="1"></label>
  <label for="ns">Steps: <b id="nsv">70</b><input id="ns" type="range" min="20" max="150" step="5" value="70"></label>
  <div class="toggles" id="tg">${OPTS.map(o=>`<button type="button" data-n="${o.n}" aria-pressed="true"><i class="dot" style="background:${o.c}"></i>${o.n}</button>`).join('')}</div>
  <div class="tools"><button class="btn main sm" id="run" type="button">Run</button></div></div>
  <div class="fig" id="fig"><svg id="loss"></svg></div>
  <div class="scroll"><table><thead><tr><th>Optimizer</th><th class="n">Final loss</th><th class="n">Steps to loss &lt; 0.01</th><th>Verdict</th></tr></thead><tbody id="res"></tbody></table></div>
  <p class="note">Each path is computed live in your browser with the real update rules. Push the learning rate above about 1.1× to watch SGD diverge.</p></div>
  <div style="margin-top:28px"><h3 style="margin-bottom:14px">The seven optimizers in the project</h3><div class="scroll"><table><thead><tr><th>Optimizer</th><th>Idea</th></tr></thead><tbody>
  ${[['SGD','Step against the gradient with a fixed learning rate.'],['SGD + Momentum','Keep a running velocity so steps build up along consistent directions and damp zig-zags.'],['Adagrad','Divide each parameter\'s step by the root of its summed squared gradients, so frequent features slow down.'],['RMSprop','Like Adagrad, but with a decaying average so the step size doesn\'t shrink to zero.'],['Adadelta','Extends RMSprop so the effective learning rate adapts without a hand-set global rate.'],['Adam','Combines momentum (first moment) with RMSprop scaling (second moment), with bias correction.'],['NAdam','Adam with Nesterov momentum, which looks ahead before taking the step.']].map(([a,b])=>`<tr><td style="white-space:nowrap"><b>${a}</b></td><td class="mute">${b}</td></tr>`).join('')}</tbody></table></div></div>`,
 init:()=>{const st={surf:'bowl',m:1,N:70,on:Object.fromEntries(OPTS.map(o=>[o.n,1]))};const S=()=>SURF[st.surf];
  const res=document.getElementById('res');
  const done=P=>{const s=S();const rows=P.map(o=>{const e=o.p[o.p.length-1];const div=o.p.length<st.N;const fl=div?Infinity:s.f(e[0],e[1]);const k=o.p.findIndex(p=>s.f(p[0],p[1])<.01);return{o,fl,k,div}});
   const best=rows.filter(r=>r.k>=0).sort((a,b)=>a.k-b.k)[0];
   res.innerHTML=rows.map(r=>`<tr><td><span style="display:inline-flex;gap:8px;align-items:center"><i class="dot" style="background:${r.o.c}"></i>${r.o.n}</span></td><td class="n">${r.div?'diverged':r.fl<1e-4?r.fl.toExponential(1):r.fl.toFixed(4)}</td><td class="n">${r.k>=0?r.k:'not reached'}</td><td class="mute">${r.div?'Learning rate too high':best&&r===best?'Fastest':r.k<0?'Still descending':'Converged'}</td></tr>`).join('')||'<tr><td colspan="4" class="mute">Turn on at least one optimizer.</td></tr>'};
  const race=Race(document.getElementById('fig'),document.getElementById('loss'),st,done);
  const tg=document.getElementById('tg');
  tg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);st.on[b.dataset.n]=on?1:0;race.go()});
  const lr=document.getElementById('lr'),ns=document.getElementById('ns');
  lr.addEventListener('input',()=>{st.m=+lr.value;document.getElementById('lrv').textContent=st.m.toFixed(2)+'×'});
  ns.addEventListener('input',()=>{st.N=+ns.value;document.getElementById('nsv').textContent=st.N});
  lr.addEventListener('change',()=>race.go());ns.addEventListener('change',()=>race.go());
  document.getElementById('surf').addEventListener('change',e=>{st.surf=e.target.value;race.go()});
  document.getElementById('run').addEventListener('click',()=>race.go());race.go()}},

reg:{h:()=>`<div class="demo"><div class="demo-bar">
  <label for="rlr">Learning rate: <b id="rlrv">0.050</b><input id="rlr" type="range" min="0.005" max="0.15" step="0.005" value="0.05"></label>
  <div class="tools"><button class="btn sm" id="rstep" type="button">1 step</button><button class="btn main sm" id="rtrain" type="button">Train 150 steps</button><button class="btn sm" id="rreset" type="button">Reset</button></div></div>
  <div class="fig short" id="rfig"><svg id="rsvg" aria-label="Scatter of house size against price with the fitted line"></svg></div>
  <div class="demo-out"><div><b id="o1">0</b><small>Steps</small></div><div><b id="o2">–</b><small>Mean squared error</small></div><div><b id="o3">–</b><small>Price per 1,000 sq ft</small></div><div><b id="o4">–</b><small>Base price</small></div></div>
  <p class="note">Sample data: 30 made-up homes, price in lakh ₹ against floor area. The real project uses the full Kaggle dataset with many features and a neural network.</p></div>`,
 init:()=>{let s=11;const r=()=>(s=s*16807%2147483647)/2147483647;const D=Array.from({length:30},()=>{const x=.6+r()*2.8;return[x,40+55*x+(r()-.5)*60]});
  let w=0,b=0,n=0,timer=null;const fig=document.getElementById('rfig'),svg=document.getElementById('rsvg');
  const mse=()=>D.reduce((a,[x,y])=>a+(w*x+b-y)**2,0)/D.length;
  const step=()=>{const lr=+document.getElementById('rlr').value;let gw=0,gb=0;D.forEach(([x,y])=>{const e=w*x+b-y;gw+=2*e*x;gb+=2*e});w-=lr*gw/D.length;b-=lr*gb/D.length;n++};
  const draw=()=>{const W=fig.clientWidth,H=fig.clientHeight;if(!W)return;const L=52,R=16,T=16,B=36;const X=x=>L+x/4*(W-L-R),Y=y=>H-B-y/300*(H-T-B);let g='';
   [0,100,200,300].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C.line}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" fill="${C.mute}" font-size="13">${v}</text>`});
   [0,1,2,3,4].forEach(v=>{g+=`<text x="${X(v)}" y="${H-12}" text-anchor="middle" fill="${C.mute}" font-size="13">${v}k</text>`});
   g+=`<text x="${W-R}" y="${H-B-8}" text-anchor="end" fill="${C.mute}" font-size="13">sq ft</text><text x="${L+6}" y="${T+12}" fill="${C.mute}" font-size="13">lakh ₹</text>`;
   D.forEach(([x,y])=>{const p=w*x+b;g+=`<line x1="${X(x)}" x2="${X(x)}" y1="${Y(y)}" y2="${Y(Math.max(-20,Math.min(320,p)))}" stroke="${C.coral}" stroke-opacity=".25"/>`});
   D.forEach(([x,y])=>{g+=`<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="${C.ice}"/>`});
   g+=`<line x1="${X(0)}" y1="${Y(b)}" x2="${X(4)}" y2="${Y(w*4+b)}" stroke="${C.coral}" stroke-width="3"/>`;
   svg.innerHTML=`<defs><clipPath id="rc"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></clipPath></defs>`+g.replace(/<line x1="([\d.]+)" y1/,'<line clip-path="url(#rc)" x1="$1" y1');
   document.getElementById('o1').textContent=n;document.getElementById('o2').textContent=n?mse().toFixed(0):'–';document.getElementById('o3').textContent=n?'₹'+w.toFixed(1)+' L':'–';document.getElementById('o4').textContent=n?'₹'+b.toFixed(1)+' L':'–'};
  const ro=new ResizeObserver(draw);ro.observe(fig);CLEAN.push(()=>{clearInterval(timer);ro.disconnect()});
  document.getElementById('rlr').addEventListener('input',e=>document.getElementById('rlrv').textContent=(+e.target.value).toFixed(3));
  document.getElementById('rstep').addEventListener('click',()=>{step();draw()});
  document.getElementById('rtrain').addEventListener('click',()=>{clearInterval(timer);let k=0;timer=setInterval(()=>{for(let i=0;i<3;i++)step();draw();if(++k>=50)clearInterval(timer)},30)});
  document.getElementById('rreset').addEventListener('click',()=>{clearInterval(timer);w=0;b=0;n=0;draw()});
  for(let i=0;i<40;i++)step();draw()}},

rec:{h:()=>`<div class="demo"><div class="demo-bar"><label for="mv">I liked<select id="mv"></select></label></div><div class="rec" id="recs"></div>
  <p class="note">Sample: 16 well-known films tagged by hand. Similarity is cosine similarity between their tag vectors, the same measure the app uses on the full TMDB dataset.</p></div>`,
 init:()=>{const M=[['Inception','sci-fi thriller dreams heist nolan dicaprio mind-bending'],['Interstellar','sci-fi space drama time-travel nolan mind-bending'],['The Dark Knight','action crime thriller superhero nolan'],['The Prestige','drama mystery thriller nolan magic mind-bending'],['The Matrix','sci-fi action simulation cyberpunk mind-bending'],['Avatar','sci-fi action adventure space cameron'],['Titanic','romance drama disaster cameron dicaprio'],['The Avengers','action superhero adventure team marvel'],['Iron Man','action superhero sci-fi tech marvel'],['Gravity','sci-fi space drama survival'],['The Martian','sci-fi space survival drama'],['Shutter Island','thriller mystery psychological dicaprio mind-bending'],['3 Idiots','comedy drama college friendship'],['Dangal','drama sports biography family'],['The Wolf of Wall Street','comedy crime biography dicaprio'],['Avengers: Endgame','action superhero adventure team marvel time-travel']].map(([n,t])=>({n,t:t.split(' ')}));
  const sel=document.getElementById('mv'),out=document.getElementById('recs');sel.innerHTML=M.map((m,i)=>`<option value="${i}">${esc(m.n)}</option>`).join('');
  const cos=(a,b)=>a.t.filter(x=>b.t.includes(x)).length/Math.sqrt(a.t.length*b.t.length);
  const r=()=>{const a=M[+sel.value];const L=M.filter(m=>m!==a).map(m=>({m,s:cos(a,m)})).sort((x,y)=>y.s-x.s).slice(0,5);
   out.innerHTML=`<p class="mute" style="font-size:14px">Top 5 recommendations for <b style="color:var(--ink)">${esc(a.n)}</b></p>`+L.map(({m,s})=>`<div class="rec-row"><b>${esc(m.n)}</b><div class="bar"><i style="width:${(s*100).toFixed(0)}%"></i></div><span class="n" style="text-align:right;font-variant-numeric:tabular-nums">${s.toFixed(2)}</span><small>${s?'Shared: '+esc(m.t.filter(x=>a.t.includes(x)).join(', ')):'Nothing in common'}</small></div>`).join('')};
  sel.addEventListener('change',r);r()}},

mtl:{h:()=>`<div class="demo">
  <div class="arch"><div class="blk"><b>Sign image</b><small>Camera frame, cropped</small></div><div class="arrow">→</div>
   <div class="blk"><b>Shared CNN backbone</b><div class="layers">${[60,52,44,36,28,22].map(h=>`<i style="height:${h}px"></i>`).join('')}</div><small>Learns features every task reuses</small></div><div class="arrow">→</div>
   <div class="heads"><div class="blk" style="border-color:${C.coral}"><b>Head 1: sign class</b><small>Stop, speed limit, yield…</small></div><div class="blk" style="border-color:${C.lime}"><b>Head 2: auxiliary task</b><small>A related task that sharpens features</small></div></div></div>
  <div class="demo-bar" style="border-top:1px solid var(--line)"><label for="lam">Auxiliary task weight λ: <b id="lamv">0.50</b><input id="lam" type="range" min="0" max="2" step="0.05" value="0.5"></label></div>
  <div class="lbars" id="lb" style="padding-top:18px"></div>
  <p class="note">Illustrative architecture and loss values; see the repository for the exact tasks and results. Total loss = L(classification) + λ · L(auxiliary).</p></div>`,
 init:()=>{const L1=.42,L2=.65,lam=document.getElementById('lam'),lb=document.getElementById('lb');
  const r=()=>{const l=+lam.value;document.getElementById('lamv').textContent=l.toFixed(2);const tot=L1+l*L2,mx=L1+2*L2;
   lb.innerHTML=[['Classification',L1,C.coral],['λ × Auxiliary',l*L2,C.lime],['Total loss',tot,C.ice]].map(([n,v,c])=>`<div class="lbar"><span>${n}</span><div><i style="width:${(v/mx*100).toFixed(1)}%;background:${c}"></i></div><b class="n" style="text-align:right;font-variant-numeric:tabular-nums">${v.toFixed(2)}</b></div>`).join('')+
   `<p class="mute" style="font-size:14px">${l===0?'λ = 0: the auxiliary head is ignored and this becomes a single-task model.':l>1.2?'High λ: the auxiliary task dominates, which can pull features away from the main task.':'A balanced λ lets the auxiliary task help without overpowering sign classification.'}</p>`};
  lam.addEventListener('input',r);r()}},

rtos:{h:()=>`<div class="demo"><div class="demo-bar"><div class="tools"><button class="btn main sm" id="play" type="button">Play 1 second</button></div><p class="mute" style="font-size:14px;flex:1 1 220px">Higher-priority work pre-empts lower-priority tasks. Interrupts (coral) jump in front of everything.</p></div>
  <div class="fig short" id="tfig"><svg id="tsvg" aria-label="FreeRTOS task timeline"></svg></div>
  <div class="demo-out" id="util"></div>
  <p class="note">Illustrative schedule with a preemptive priority scheduler and 1 ms ticks. Task periods and run times are example values, not measurements from the firmware.</p></div>`,
 init:()=>{const TK=[{n:'ISR (button)',sn:'ISR',p:9,c:C.coral,ev:[330,710],d:6},{n:'SensorTask',sn:'Sensor',p:3,c:C.lime,per:100,off:0,d:14},{n:'DisplayTask',sn:'Display',p:2,c:C.ice,per:200,off:5,d:45},{n:'LoggerTask',sn:'Logger',p:1,c:C.sand,per:500,off:10,d:70},{n:'Idle',sn:'Idle',p:0,c:'#3a3f4a'}];
  const rem=TK.map(()=>0),run=[];for(let t=0;t<1000;t++){TK.forEach((k,i)=>{if(k.ev&&k.ev.includes(t))rem[i]+=k.d;if(k.per&&(t-k.off)%k.per===0&&t>=k.off)rem[i]+=k.d});let w=TK.length-1,bp=-1;TK.forEach((k,i)=>{if(k.p>0&&rem[i]>0&&k.p>bp){bp=k.p;w=i}});if(w!==TK.length-1)rem[w]--;run.push(w)}
  const segs=[];run.forEach((w,t)=>{const l=segs[segs.length-1];if(l&&l.w===w&&l.e===t)l.e=t+1;else segs.push({w,s:t,e:t+1})});
  document.getElementById('util').innerHTML=TK.map((k,i)=>`<div><b style="color:${k.c}">${(run.filter(x=>x===i).length/10).toFixed(1)}%</b><small>${k.n} CPU</small></div>`).join('');
  const fig=document.getElementById('tfig'),svg=document.getElementById('tsvg');let T=1000,timer=null;
  const draw=()=>{const W=fig.clientWidth,H=fig.clientHeight;if(!W)return;const sm=W<520,L=sm?64:110,R=12,top=10,B=30,rh=(H-top-B)/TK.length,X=t=>L+t/1000*(W-L-R);let g='';
   TK.forEach((k,i)=>{const y=top+i*rh;g+=`<line x1="${L}" x2="${W-R}" y1="${y+rh}" y2="${y+rh}" stroke="${C.line}"/><text x="${L-10}" y="${y+rh/2+5}" text-anchor="end" fill="${C.mute}" font-size="13">${sm?k.sn:k.n}</text>`});
   [0,250,500,750,1000].forEach(t=>{if(sm&&(t===250||t===750))return;g+=`<text x="${X(t)}" y="${H-10}" text-anchor="${t===0?'start':t===1000?'end':'middle'}" fill="${C.mute}" font-size="13">${t} ms</text>`});
   segs.forEach(s=>{if(s.s>=T)return;const y=top+s.w*rh+rh*.2;g+=`<rect x="${X(s.s).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1.5,X(Math.min(s.e,T))-X(s.s)).toFixed(1)}" height="${(rh*.6).toFixed(1)}" rx="2" fill="${TK[s.w].c}"/>`});
   if(T<1000)g+=`<line x1="${X(T)}" x2="${X(T)}" y1="${top}" y2="${H-B}" stroke="${C.ink}" stroke-width="1.5"/>`;svg.innerHTML=g};
  const ro=new ResizeObserver(draw);ro.observe(fig);CLEAN.push(()=>{clearInterval(timer);ro.disconnect()});
  document.getElementById('play').addEventListener('click',()=>{clearInterval(timer);T=0;timer=setInterval(()=>{T+=10;draw();if(T>=1000)clearInterval(timer)},25)});draw()}}
};
const projPage=p=>{const i=PROJ.indexOf(p),pv=PROJ[(i+PROJ.length-1)%PROJ.length],nx=PROJ[(i+1)%PROJ.length],D=DEMOS[p.demo];return{t:p.short,h:()=>`
<section class="band ph"><div class="wrap"><div class="crumb"><a href="#home">Home</a><span>/</span><a href="#projects">Projects</a><span>/</span>${esc(p.short)}</div>
 <div class="p-hero"><div><span class="mono kind">${esc(p.k)}</span><h1 style="margin-top:10px">${esc(p.n)}</h1><p class="lead">${esc(p.d)}</p><div class="ctas"><a class="btn main" href="${GH}/${encodeURIComponent(p.repo)}">${ICON.gh}View code on GitHub</a><a class="btn" href="#demo-${p.s}">Try the demo</a></div></div>
 <div class="facts"><div><span>Category</span><b>${esc(p.k)}</b></div><div><span>Stack</span><b>${esc(p.t.join(', '))}</b></div><div><span>Repository</span><b><a href="${GH}/${encodeURIComponent(p.repo)}">GitHub</a></b></div></div></div></div></section>
<section class="band alt"><div class="wrap split"><div><h2>Why it matters</h2></div><p class="txt">${esc(p.why)}</p></div></section>
<section class="band"><div class="wrap split"><div><h2>How it works</h2></div><div class="steps">${p.how.map(([a,b])=>`<div><div><b>${esc(a)}</b><p>${esc(b)}</p></div></div>`).join('')}</div></div></section>
<section class="band alt" id="demo-${p.s}"><div class="wrap"><div class="sec-head"><h2>Interactive demo</h2><p>Runs entirely in your browser.</p></div>${D.h()}</div></section>
<section class="band"><div class="wrap pager"><a href="#project-${pv.s}"><small>← Previous project</small><b>${esc(pv.short)}</b></a><a href="#project-${nx.s}"><small>Next project →</small><b>${esc(nx.short)}</b></a></div></section>${cta()}`,init:D.init}};

/* ================= ROUTER ================= */
const app=document.getElementById('app'),links=document.getElementById('links'),menu=document.getElementById('menu');
links.innerHTML=NAV.map(([h,l])=>`<a href="#${h}" data-h="${h}">${l}</a>`).join('');
menu.addEventListener('click',()=>{const o=links.classList.toggle('open');menu.setAttribute('aria-expanded',o)});
const show=()=>{
  const h=location.hash.slice(1)||'home';
  if(h.startsWith('demo-')){const el=document.getElementById(h);if(el){el.scrollIntoView();return}}
  CLEAN.forEach(f=>f());CLEAN=[];
  let pg=PAGES[h];if(!pg&&h.startsWith('project-')&&PBY[h.slice(8)])pg=projPage(PBY[h.slice(8)]);
  if(!pg)pg={t:'Not found',h:()=>head('Not found','Page not found','That page doesn\'t exist. Try the home page or the project list.')+`<section class="band" style="padding-top:0"><div class="wrap ctas"><a class="btn main" href="#home">Home</a><a class="btn" href="#projects">Projects</a></div></section>`};
  app.innerHTML=pg.h();document.title=(h==='home'?'Atharva Gosavi · AI Engineer':pg.t+' · Atharva Gosavi');
  const sect=h.startsWith('project-')?'projects':h;
  links.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.h===sect));
  links.classList.remove('open');menu.setAttribute('aria-expanded','false');
  window.scrollTo(0,0);
  app.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(EMAIL);b.textContent='Copied'}catch(e){b.textContent='Select to copy'}setTimeout(()=>b.textContent='Copy',1800)}));
  try{pg.init&&pg.init()}catch(e){console.error(e)}
};
window.addEventListener('hashchange',show);
show();
}
</script>
</body>
